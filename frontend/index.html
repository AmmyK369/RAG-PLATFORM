<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Amara Tech Knowledge Assistant</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  input, button { font-size: 15px; padding: 8px 10px; }
  button { cursor: pointer; border: 1px solid #888; background: #fff; border-radius: 6px; }
  button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  .header { display: flex; justify-content: space-between; align-items: center; }
  .msg { padding: 10px 12px; border-radius: 8px; margin: 8px 0; white-space: pre-wrap; }
  .user { background: #dbeafe; text-align: right; }
  .bot { background: #f1f5f9; }
  .src { font-size: 13px; color: #475569; margin-top: 6px; }
  .tabs button { margin-right: 6px; }
  .tabs button.active { background: #2563eb; color: #fff; }
  .error { color: #b91c1c; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

async function api(path, options = {}, token) {
  const headers = { ...(options.headers || {}) };
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(path, { ...options, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || "Request failed");
  return data;
}
const JSON_HEADERS = { "Content-Type": "application/json" };

function Login({ onLogin }) {
  const [username, setUsername] = useState("emma");
  const [password, setPassword] = useState("emma123");
  const [error, setError] = useState("");
  async function submit() {
    try {
      const data = await api("/login", { method: "POST", headers: JSON_HEADERS,
        body: JSON.stringify({ username, password }) });
      onLogin(data);
    } catch (e) { setError(e.message); }
  }
  return (
    <div className="wrap"><div className="card">
      <h2>Amara Tech Knowledge Assistant</h2>
      <p>Demo users: emma (employee), ethan (engineer), alice (admin)</p>
      <input value={username} onChange={e => setUsername(e.target.value)} placeholder="username" />{" "}
      <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="password" />{" "}
      <button className="primary" onClick={submit}>Log in</button>
      {error && <p className="error">{error}</p>}
    </div></div>
  );
}

function Chat({ token }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const endRef = useRef(null);
  useEffect(() => { if (endRef.current) endRef.current.scrollIntoView({ behavior: "smooth" }); }, [messages]);

  async function send() {
    const q = input.trim();
    if (!q || loading) return;
    setInput(""); setLoading(true);
    setMessages(m => [...m, { who: "user", text: q }]);
    try {
      const data = await api("/ask", { method: "POST", headers: JSON_HEADERS,
        body: JSON.stringify({ question: q }) }, token);
      setMessages(m => [...m, { who: "bot", text: data.answer, sources: data.sources,
        id: data.message_id, rating: null }]);
    } catch (e) {
      setMessages(m => [...m, { who: "bot", text: "Error: " + e.message, sources: [] }]);
    }
    setLoading(false);
  }

  async function rate(id, rating) {
    try {
      await api("/feedback", { method: "POST", headers: JSON_HEADERS,
        body: JSON.stringify({ message_id: id, rating }) }, token);
      setMessages(m => m.map(x => x.id === id ? { ...x, rating } : x));
    } catch (e) { alert(e.message); }
  }

  return (
    <div className="card">
      {messages.length === 0 && <p>Ask a question about your documents.</p>}
      {messages.map((m, i) => (
        <div key={i} className={"msg " + m.who}>
          {m.text}
          {m.who === "bot" && m.sources && m.sources.length > 0 && (
            <div className="src">
              <b>Sources:</b>
              {m.sources.map(s => <div key={s.n}>[{s.n}] {s.file}</div>)}
            </div>
          )}
          {m.who === "bot" && m.id && (
            <div style={{ marginTop: 6 }}>
              <button onClick={() => rate(m.id, "up")} disabled={m.rating !== null}>{m.rating === "up" ? "👍 Thanks" : "👍"}</button>{" "}
              <button onClick={() => rate(m.id, "down")} disabled={m.rating !== null}>{m.rating === "down" ? "👎 Noted" : "👎"}</button>
            </div>
          )}
        </div>
      ))}
      {loading && <p>Thinking...</p>}
      <div ref={endRef} />
      <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
        <input style={{ flex: 1 }} value={input} placeholder="Type your question..."
          onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && send()} />
        <button className="primary" onClick={send}>Send</button>
      </div>
    </div>
  );
}

function Admin({ token }) {
  const [file, setFile] = useState(null);
  const [roles, setRoles] = useState({ employee: true, engineer: true, admin: true });
  const [status, setStatus] = useState("");
  async function upload() {
    if (!file) { setStatus("Choose a file first."); return; }
    const chosen = Object.keys(roles).filter(r => roles[r]);
    const form = new FormData();
    form.append("file", file);
    form.append("roles", chosen.join(","));
    setStatus("Uploading and indexing...");
    try {
      const data = await api("/admin/upload", { method: "POST", body: form }, token);
      setStatus("Done: " + data.chunks_added + " chunks added from " + data.file);
    } catch (e) { setStatus("Error: " + e.message); }
  }
  return (
    <div className="card">
      <h3>Upload a document</h3>
      <input type="file" accept=".txt,.pdf,.docx" onChange={e => setFile(e.target.files[0])} />
      <p>Who may see it?</p>
      {Object.keys(roles).map(r => (
        <label key={r} style={{ marginRight: 12 }}>
          <input type="checkbox" checked={roles[r]}
            onChange={e => setRoles({ ...roles, [r]: e.target.checked })} /> {r}
        </label>
      ))}
      <p><button className="primary" onClick={upload}>Upload</button></p>
      <p>{status}</p>
    </div>
  );
}

function App() {
  const [session, setSession] = useState(null);
  const [tab, setTab] = useState("chat");
  if (!session) return <Login onLogin={setSession} />;
  return (
    <div className="wrap">
      <div className="card header">
        <div><b>{session.username}</b> ({session.role})</div>
        <div className="tabs">
          <button className={tab === "chat" ? "active" : ""} onClick={() => setTab("chat")}>Chat</button>
          {session.role === "admin" &&
            <button className={tab === "admin" ? "active" : ""} onClick={() => setTab("admin")}>Admin</button>}
          <button onClick={() => { setSession(null); setTab("chat"); }}>Log out</button>
        </div>
      </div>
      <div style={{ display: tab === "chat" ? "block" : "none" }}><Chat token={session.token} /></div>
      {tab === "admin" && <Admin token={session.token} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
